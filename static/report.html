<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>报账提交</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f7; margin: 0; padding: 16px; font-size: 15px; }
.card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); max-width: 480px; margin: 0 auto; }
h2 { text-align: center; color: #1e293b; font-size: 18px; margin: 0 0 20px; }
.row { display: flex; gap: 10px; margin-bottom: 14px; }
.row>div { flex: 1; }
label { display: block; font-size: 13px; color: #64748b; margin-bottom: 4px; font-weight: 500; }
input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 15px; color: #1e293b; background: #fff; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #4f6ef7; }
textarea { resize: vertical; min-height: 60px; }
.type-btn { flex: 1; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; text-align: center; font-size: 15px; cursor: pointer; background: #fff; font-weight: 500; }
.type-btn.out-active { border-color: #ef4444; color: #ef4444; background: #fef2f2; }
.type-btn.in-active { border-color: #22c55e; color: #22c55e; background: #f0fdf4; }
.btn { width: 100%; padding: 12px; background: #4f6ef7; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 6px; }
.btn:active { background: #3d5ce5; }
.msg { text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; display: none; }
.msg-ok { background: #f0fdf4; color: #22c55e; display: block; }
.msg-err { background: #fef2f2; color: #ef4444; display: block; }
.preview { margin-top: 8px; }
.preview img { max-width: 100%; max-height: 150px; border-radius: 8px; border: 1px solid #e2e8f0; }
</style>
</head>
<body>
<div class="card">
<h2>📋 报账提交</h2>
<div id="msg"></div>
<div class="row">
  <div class="type-btn out-active" id="btnOut" onclick="setType('支出')">💸 支出</div>
  <div class="type-btn" id="btnIn" onclick="setType('收入')">💰 收入</div>
</div>
<div><label>金额 (元)</label><input type="number" id="amount" placeholder="请输入金额" step="0.01"></div>
<div class="row">
  <div><label>日期</label><input type="date" id="date"></div>
  <div><label>类别</label>
    <select id="category">
      <option value="货款">货款</option><option value="日杂">日杂</option><option value="辅料">辅料</option>
      <option value="运费">运费</option><option value="印花">印花</option><option value="布">布</option>
      <option value="货拉拉">货拉拉</option><option value="其他">其他</option>
    </select>
  </div>
</div>
<div class="row">
  <div><label>明细说明</label><input id="detail" placeholder="简要说明"></div>
  <div><label>责任人</label><input id="person" placeholder="姓名"></div>
</div>
<div><label>凭证截图</label><input type="file" id="receipt" accept="image/*" onchange="previewImage()"></div>
<div class="preview" id="preview"></div>
<button class="btn" onclick="submit()">提交报账</button>
</div>

<script>
let type = '支出';
function setType(t) { type = t; document.getElementById('btnOut').className = t==='支出'?'type-btn out-active':'type-btn'; document.getElementById('btnIn').className = t==='收入'?'type-btn in-active':'type-btn'; }
function previewImage() {
  const f = document.getElementById('receipt').files[0];
  document.getElementById('preview').innerHTML = f ? `<img src="${URL.createObjectURL(f)}">` : '';
}
async function submit() {
  const amount = document.getElementById('amount').value;
  const date = document.getElementById('date').value;
  const category = document.getElementById('category').value;
  const detail = document.getElementById('detail').value;
  const person = document.getElementById('person').value;
  const msg = document.getElementById('msg');

  if (!amount || !date || !person) { msg.className = 'msg msg-err'; msg.textContent = '请填写金额、日期和责任人'; return; }

  const fd = new FormData();
  fd.append('type', type); fd.append('amount', amount); fd.append('date', date);
  fd.append('category', category); fd.append('detail', detail); fd.append('person', person);
  const file = document.getElementById('receipt').files[0];
  if (file) fd.append('receipt', file);

  try {
    const res = await fetch('/api/finance', { method: 'POST', body: fd });
    const data = await res.json();
    if (res.ok) {
      msg.className = 'msg msg-ok'; msg.textContent = '✅ 提交成功！';
      document.getElementById('amount').value = '';
      document.getElementById('detail').value = '';
      document.getElementById('preview').innerHTML = '';
      document.getElementById('receipt').value = '';
    } else {
      msg.className = 'msg msg-err'; msg.textContent = '❌ ' + (data.detail || '提交失败');
    }
  } catch(e) {
    msg.className = 'msg msg-err'; msg.textContent = '❌ 网络错误';
  }
}
document.getElementById('date').value = new Date().toISOString().slice(0,10);
</script>
</body>
</html>
