<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>初始化余额</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
.card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); max-width: 400px; width: 100%; }
h2 { text-align: center; color: #1e293b; font-size: 18px; margin: 0 0 20px; }
label { display: block; font-size: 13px; color: #64748b; margin-bottom: 4px; font-weight: 500; }
input { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 15px; margin-bottom: 14px; }
input:focus { outline: none; border-color: #4f6ef7; }
.btn { width: 100%; padding: 12px; background: #4f6ef7; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
.msg { text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 12px; display: none; }
.msg-ok { background: #f0fdf4; color: #22c55e; display: block; }
.msg-err { background: #fef2f2; color: #ef4444; display: block; }
</style>
</head>
<body>
<div class="card">
<h2>💰 初始化期初余额</h2>
<div id="msg"></div>
<input type="password" id="secret" placeholder="密钥">
<input type="number" id="amount" placeholder="期初余额金额" step="0.01">
<input type="text" id="person" placeholder="操作人">
<button class="btn" onclick="initBalance()">确认初始化</button>
</div>
<script>
async function initBalance() {
  const secret = document.getElementById('secret').value;
  const amount = document.getElementById('amount').value;
  const person = document.getElementById('person').value;
  const msg = document.getElementById('msg');
  if (!secret || !amount) { msg.className = 'msg msg-err'; msg.textContent = '请填写密钥和金额'; return; }
  const fd = new FormData();
  fd.append('secret', secret); fd.append('amount', amount); fd.append('person', person);
  try {
    const res = await fetch('/api/finance/init-balance', { method: 'POST', body: fd });
    const data = await res.json();
    if (res.ok) {
      msg.className = 'msg msg-ok'; msg.textContent = `✅ 初始化成功！金额: ¥${data.balance}`;
    } else {
      msg.className = 'msg msg-err'; msg.textContent = '❌ ' + (data.detail || '错误');
    }
  } catch(e) {
    msg.className = 'msg msg-err'; msg.textContent = '❌ 网络错误';
  }
}
</script>
</body>
</html>
