<style>
  :root {
    --primary: #4f6ef7;
    --primary-light: #eef1ff;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --bg: #f0f2f7;
    --card-bg: #fff;
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --border: #e2e8f0;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08);
    --radius: 10px;
    --radius-sm: 6px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; background: var(--bg); margin:0; color: var(--text); font-size: 14px; line-height: 1.5; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }

  /* 卡片 */
  .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .card-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }

  /* 统计卡片 */
  .stat-card { color: #fff; border-radius: var(--radius); padding: 22px 20px; margin-bottom: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat-card .label { font-size: 12px; opacity: .85; font-weight: 500; }
  .stat-card .value { font-size: 28px; font-weight: 800; margin-top: 8px; }

  /* 标签 */
  .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .tag-out { background: #fef2f2; color: var(--danger); }
  .tag-in { background: #f0fdf4; color: var(--success); }
  .low-stock { color: var(--danger); font-weight: 700; }

  /* 表单 */
  input, select { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; color: var(--text); background: #fff; max-width: 100%; transition: border-color .15s; }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.1); }

  /* 表格 */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -8px; padding: 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: #f8fafc; color: var(--text-secondary); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; }
  td { color: var(--text); }
  tr:hover td { background: #fafbfd; }
  tfoot td { font-weight: 700; background: #f8fafc !important; }

  /* 按钮 */
  button { padding: 8px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all .15s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; white-space: nowrap; }
  button:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #3d5ce5; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #16a34a; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-warning { background: var(--warning); color: #fff; }
  .btn-warning:hover { background: #d97706; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 4px; }

  /* 登录 */
  .login-box { max-width: 400px; margin: 80px auto; background: #fff; border-radius: 16px; padding: 40px 32px; box-shadow: var(--shadow-md); text-align: center; }
  .login-box input { width: 100%; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; border-radius: 8px; }
  .login-box h2 { margin: 0 0 6px; color: var(--text); font-size: 20px; }
  .login-box .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
  .error-msg { background: #fef2f2; color: var(--danger); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }

  /* === 侧边栏 === */
  .app-layout { display: flex; min-height: 100vh; }
  .sidebar { width: 210px; min-width: 210px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top:0; left:0; bottom:0; z-index: 100; overflow-y: auto; }
  .sidebar-logo { padding: 20px 16px; text-align: center; border-bottom: 1px solid var(--border); }
  .sidebar-logo img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
  .sidebar-logo .name { font-size: 13px; font-weight: 700; color: var(--text); margin-top: 6px; }
  .sidebar-logo .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .sidebar-nav { flex:1; padding: 8px; }
  .sidebar-nav button { display: block; width: 100%; text-align: left; padding: 10px 14px; border-radius: 8px; background: none; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 1px 0; transition: all .12s; }
  .sidebar-nav button:hover { background: var(--bg); color: var(--text); }
  .sidebar-nav button.active { color: var(--primary); background: var(--primary-light); font-weight: 600; }
  .sidebar-footer { padding: 10px 8px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
  .sidebar-footer button { flex: 1; padding: 7px 6px; font-size: 12px; border-radius: 8px; }
  .main-content { margin-left: 210px; flex: 1; padding: 20px; min-width: 0; max-width: 1440px; }

  /* 移动端 */
  @media (max-width: 768px) {
    .app-layout { flex-direction: column; }
    .sidebar { position: fixed; bottom: 0; top: auto; left: 0; right: 0; width: 100%; min-width: 100%; height: auto; flex-direction: row; overflow-x: auto; overflow-y: hidden; border-right: none; border-top: 1px solid var(--border); z-index: 100; box-shadow: 0 -3px 10px rgba(0,0,0,.1); padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 10px)); background: #fff; }
    .sidebar-logo { display: none; }
    .sidebar-nav { display: flex; flex: 1; overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 0; scrollbar-width: none; }
    .sidebar-nav::-webkit-scrollbar { display: none; }
    .sidebar-nav button { flex-shrink: 0; width: auto; padding: 12px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; border-radius: 8px; margin: 0 1px; min-height: 44px; }
    .sidebar-nav button.active { color: var(--primary); background: var(--primary-light); }
    .sidebar-footer { display: none; }
    .main-content { margin-left: 0; padding: 60px 10px 100px 10px; }
    .card { padding: 14px; border-radius: 8px; margin-bottom: 12px; }
    .stat-card { padding: 16px 14px; }
    .stat-card .value { font-size: 22px; }
    th, td { padding: 6px 8px; font-size: 12px; }
    input, select { font-size: 16px; padding: 10px 8px; }
    button { padding: 10px 14px; font-size: 14px; min-height: 40px; }
    .btn-sm { padding: 6px 10px; font-size: 12px; min-height: 32px; }
    .btn-xs { padding: 5px 10px; font-size: 11px; min-height: 28px; }
    .login-box { margin: 40px 12px; padding: 28px 20px; }
    .login-box h2 { font-size: 18px; }
  }
  @media (min-width: 769px) {
    .login-box { margin: 100px auto; }
  }
  @media (min-width: 769px) {
    .login-box { margin: 100px auto; }
  }
</style>

<style>
/* 下拉刷新指示器 */
.pull-indicator { position: fixed; top: -60px; left: 0; right: 0; height: 50px; z-index: 1000; display: flex; align-items: center; justify-content: center; transition: top .2s; font-size: 14px; color: #4f6ef7; background: #eef1ff; pointer-events: none; }
.pull-indicator.show { top: 0; }
.pull-indicator .spinner { width: 20px; height: 20px; border: 2px solid #4f6ef7; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; display: none; }
.pull-indicator .spinner.show { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<div class="pull-indicator" id="pullIndicator"><span class="spinner" id="pullSpinner"></span><span id="pullText">下拉刷新</span></div>
<script>
(function(){
  var startY=0, pulling=false, threshold=60;
  var indicator=document.getElementById('pullIndicator');
  var spinner=document.getElementById('pullSpinner');
  var text=document.getElementById('pullText');
  var main=document.querySelector('.main-content');

  document.addEventListener('touchstart', function(e){ if(window.scrollY===0){startY=e.touches[0].clientY; pulling=true;} });
  document.addEventListener('touchmove', function(e){
    if(!pulling) return;
    var dy=e.touches[0].clientY-startY;
    if(dy>20){ indicator.classList.add('show'); text.textContent=dy>threshold?'松开刷新':'下拉刷新'; }
  }, {passive: false});
  document.addEventListener('touchend', function(e){
    if(!pulling){ indicator.classList.remove('show'); return; }
    pulling=false;
    var dy=e.changedTouches[0].clientY-startY;
    if(dy>threshold){
      text.textContent='刷新中...'; spinner.classList.add('show');
      setTimeout(function(){ location.reload(); }, 500);
    } else { indicator.classList.remove('show'); }
  });
})();
</script>
<script src="/static/vue.global.prod.js"></script>
<script>
const { createApp, ref, computed, onMounted, h } = Vue;

createApp({
  setup() {
    // === Auth ===
    const token = ref(localStorage.getItem('wms_token') || '');
    const authUser = ref(JSON.parse(localStorage.getItem('wms_user') || 'null'));
    const loginUsername = ref(localStorage.getItem('wms_remember_user') || '');
    const loginPassword = ref(localStorage.getItem('wms_remember_pass') || '');
    const loginError = ref('');
    const loginLoading = ref(false);
    const rememberMe = ref(!!localStorage.getItem('wms_remember_user'));

    const doLogin = async () => {
      loginError.value = ''; loginLoading.value = true;
      try {
        const res = await fetch('/api/auth/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username: loginUsername.value, password: loginPassword.value})
        });
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
        const data = await res.json();
        token.value = data.token;
        authUser.value = {username: data.username, role: data.role};
        localStorage.setItem('wms_token', data.token);
        localStorage.setItem('wms_user', JSON.stringify(authUser.value));
        // 记住密码
        if (rememberMe.value) {
          localStorage.setItem('wms_remember_user', loginUsername.value);
          localStorage.setItem('wms_remember_pass', loginPassword.value);
        } else {
          localStorage.removeItem('wms_remember_user');
          localStorage.removeItem('wms_remember_pass');
        }
      } catch(e) { loginError.value = e.message; }
      loginLoading.value = false;
    };

    const doLogout = async () => {
      try { await api('/api/auth/logout', {method:'POST'}); } catch(e) {}
      token.value = ''; authUser.value = null;
      localStorage.removeItem('wms_token'); localStorage.removeItem('wms_user');
    };

    // === Main app state ===
    const currentTab = ref('dashboard');
    const salSub = ref('enter');
    const today = new Date().toISOString().slice(0, 10);
    const showLogs = ref(false);  // toggle for operation log modal

    // Dashboard
    const dash = ref({today_out_amount:0,today_in_qty:0,month_total:0,low_stock_count:0,total_specs:0,total_colors:0});
    const dashBalance = ref(0);

    // Entry
    const entryDate = ref(today);
    const entryRows = ref([]);
    const submitting = ref(false);
    const msg = ref('');
    const msgType = ref('ok');
    const todayRecords = ref({outbound:[], inbound:[]});
    const quickType = ref('出库');
    const quickSpec = ref('');
    const quickSP = ref('');

    // Base data
    const specs = ref([]);
    const colors = ref([]);
    const salespersons = ref([]);

    // Inventory
    const invData = ref({});
    const invFilter = ref('');
    const invLowStock = ref([]);

    // Outbound
    const obSP = ref('');
    const obYear = ref(new Date().getFullYear());
    const obMonth = ref(new Date().getMonth()+1);
    const obData = ref(null);

    // Inbound
    const inYear = ref(new Date().getFullYear());
    const inMonth = ref(new Date().getMonth()+1);
    const inData = ref(null);

    // Summary
    const sumYear = ref(new Date().getFullYear());
    const sumMonth = ref(new Date().getMonth() + 1);
    const summary = ref(null);

    // Salary
    const salWorkers = ref([]); const salPrices = ref([]); const salItemSpecs = ref([]); const salRecords = ref([]);
    const salSummary = ref([]); const salMonth = ref(new Date().toISOString().slice(0,10));
    const salPage = ref(1); const salPageSize = ref(30); const salTotal = ref(0);
    const salFilterSpec = ref('');
    const salFilterColor = ref('');
    const salQuickSpec = ref('');
    const salQuickColor = ref('');
    const salQuickWorker = ref('');
    const salSpecItems = ref([]);
    const salNewLinkSpec = ref('');
    const salNewLinkItem = ref('');
    const salEditLinkId = ref(0);
    const salEditLinkItem = ref('');
    const salEditLinkPrice = ref(0);
    const salNewWorker = ref(''); const salNewJobType = ref('机工');
    const salNewItem = ref(''); const salNewPrice = ref('');
    const salEditWorkerId = ref(0); const salEditItemId = ref(0);

    // Finance
    const finYear = ref(new Date().getFullYear());
    const finMonth = ref(new Date().getMonth() + 1);
    const finRecords = ref([]);
    const finSummary = ref({total_in:0,total_out:0,balance:0});
    const finCategories = ref([]);
    const newFinCat = ref('');

    // Analysis
    const analysisYear = ref(new Date().getFullYear());
    const analysisMonth = ref(new Date().getMonth() + 1);
    const analysisData = ref(null);

    // Settings
    const newSpec = ref('');
    const newColor = ref('');
    const newColorCode = ref('');
    const newSP = ref('');
    const newSPType = ref('员工');
    const importResult = ref(null);
    const globalSettings = ref({low_stock_threshold: 50});
    const skuThresholds = ref([]);

    const api = async (url, opts={}) => {
      const headers = {'Content-Type':'application/json', ...opts.headers};
      if (token.value) headers['Authorization'] = 'Bearer ' + token.value;
      const res = await fetch(url, {headers, ...opts, ...(opts.body?{body:opts.body}:{})});
      if (!res.ok) {
        const e = await res.json().catch(()=>({detail:'Request failed'}));
        if (res.status === 401) { doLogout(); throw new Error('登录已过期'); }
        throw new Error(e.detail||'Error');
      }
      return res.json();
    };

    const refreshAll = async () => {
      const results = await Promise.all([
        api('/api/dashboard'), api('/api/specs'), api('/api/colors'), api('/api/salespersons')
      ]);
      [dash.value, specs.value, colors.value, salespersons.value] = results;
      const inv = await api('/api/inventory');
      invData.value = inv.inventory;
      invLowStock.value = inv.low_stock;
      try { globalSettings.value = await api('/api/settings'); } catch(e) {}
      try { skuThresholds.value = await api('/api/skus'); } catch(e) {}
      try { loadTodayRecords(); } catch(e) {}
      try { const fs = await api('/api/finance/summary'); dashBalance.value = fs.balance; } catch(e) {}
      if (authUser.value?.role === 'superadmin') loadAdmins();
    };

    onMounted(refreshAll);

    const addEntryRow = (type) => entryRows.value.push({type,spec:'',color:'',qty:1,price:0,sp:'',remark:''});

    // Quick-fill computed: unique specs from inventory
    const quickSpecs = computed(() => Object.keys(invData.value));

    // Quick-fill computed: colors for selected spec
    const quickColors = computed(() => {
      if (!quickSpec.value) return [];
      const items = invData.value[quickSpec.value] || [];
      return items.map(i => i.color);
    });

    const quickAdd = (color) => {
      entryRows.value.push({type:quickType.value, spec:quickSpec.value, color, qty:1, price:0, sp:quickSP.value, remark:''});
      quickSpec.value = '';
    };

    const submitEntries = async () => {
      const items = entryRows.value.map(r => ({
        trans_date: entryDate.value, trans_type: r.type,
        spec_name: r.spec.trim(), color_name: r.color.trim(),
        quantity: r.qty||0, unit_price: r.type==='出库'?(r.price||0):0,
        salesperson_name: r.sp.trim(), remark: r.remark
      }));
      const inv = items.find(i => !i.spec_name||!i.color_name||!i.quantity||!i.salesperson_name);
      if (inv) { msg.value='请填写完整信息（销售人必填）'; msgType.value='err'; return; }
      submitting.value = true;
      try {
        await api('/api/transactions/batch', {method:'POST',body:JSON.stringify({items})});
        entryRows.value = []; msg.value=`录入成功!`; msgType.value='ok'; refreshAll();
      } catch(e) { msg.value=e.message; msgType.value='err'; }
      loadTodayRecords();
      submitting.value = false;
    };

    const loadTodayRecords = async () => {
      try {
        todayRecords.value = await api(`/api/reports/daily?trans_date=${entryDate.value}`);
      } catch(e) {}
    };

    const deleteTransaction = async (id) => {
      if (!confirm('确定撤销这条记录？库存会自动恢复。')) return;
      try {
        await api(`/api/transactions/${id}`, {method:'DELETE'});
        loadTodayRecords();
        refreshAll();
      } catch(e) { alert(e.message); }
    };

    const loadOutbound = async () => {
      const sp = obSP.value ? `&salesperson=${encodeURIComponent(obSP.value)}` : '';
      obData.value = await api(`/api/bills/personal?year=${obYear.value}&month=${obMonth.value}${sp}`);
    };

    const exportOutbound = () => {
      if (!obData.value) return;
      let csv='日期,规格,颜色,数量,单价,金额\n';
      obData.value.items.forEach(i => csv+=`${i.date},${i.spec},${i.color},${i.quantity},${i.unit_price},${i.amount}\n`);
      csv+=`\n合计,,,${obData.value.total_qty},,${obData.value.total_amount}`;
      const b=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(b);
      a.download=`${obData.value.salesperson}_${obData.value.year}年${obData.value.month}月_出库.csv`; a.click();
    };

    const loadInbound = async () => {
      inData.value = await api(`/api/bills/inbound?year=${inYear.value}&month=${inMonth.value}`);
    };

    const exportInbound = () => {
      if (!inData.value) return;
      let csv='日期,规格,颜色,数量,人员,备注\n';
      inData.value.items.forEach(i => csv+=`${i.date},${i.spec},${i.color},${i.quantity},${i.salesperson},${i.remark}\n`);
      csv+=`\n合计,,,${inData.value.total_qty}`;
      const b=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(b);
      a.download=`入库记录_${inData.value.year}年${inData.value.month}月.csv`; a.click();
    };

    const loadSummary = async () => {
      summary.value = await api(`/api/reports/sales-summary?year=${sumYear.value}&month=${sumMonth.value}`);
    };

    // -- Salary functions --
    const loadSalary = async () => {
      const [workers, prices, itemSpecs, recordsData, summary] = await Promise.all([
        api('/api/salary/workers'), api('/api/salary/prices'), api('/api/salary/item-specs'),
        api(`/api/salary/records?month=${salMonth.value}&page=${salPage.value}&page_size=${salPageSize.value}`),
        api(`/api/salary/summary?month=${salMonth.value}`)
      ]);
      salWorkers.value = workers; salPrices.value = prices; salItemSpecs.value = itemSpecs;
      salRecords.value = recordsData.items; salTotal.value = recordsData.total; salSummary.value = summary;
      try { salSpecItems.value = await api('/api/salary/spec-items'); } catch(e) {}
    };
    const saveSalWorker = async () => {
      if (!salNewWorker.value.trim()) return;
      await api(`/api/salary/workers?name=${encodeURIComponent(salNewWorker.value.trim())}&job_type=${salNewJobType.value}`, {method:'POST'});
      salNewWorker.value = ''; loadSalary();
    };
    const deleteSalWorker = async (id) => {
      if (!confirm('确定删除？')) return;
      await api(`/api/salary/workers/${id}`, {method:'DELETE'}); loadSalary();
    };
    const saveSalPrice = async () => {
      if (!salNewItem.value.trim() || !salNewPrice.value) return;
      await api(`/api/salary/prices?item_name=${encodeURIComponent(salNewItem.value.trim())}&unit_price=${salNewPrice.value}`, {method:'POST'});
      salNewItem.value = ''; salNewPrice.value = ''; loadSalary();
    };
    const loadSpecItems = async () => { try { salSpecItems.value = await api('/api/salary/spec-items'); } catch(e) {} };
    const initSpecItems = async () => {
      if (!confirm('自动匹配工序→规格并导入关联表？')) return;
      const r = await api('/api/salary/spec-items/init', {method:'POST'});
      alert(`导入了 ${r.imported} 条关联`); loadSpecItems();
    };
    const saveSpecItem = async () => {
      if (!salNewLinkSpec.value || !salNewLinkItem.value) return;
      const price = parseFloat(document.getElementById('salNewLinkPrice')?.value)||0;
      await api(`/api/salary/spec-items?spec_name=${encodeURIComponent(salNewLinkSpec.value)}&item_name=${encodeURIComponent(salNewLinkItem.value)}&unit_price=${price}`, {method:'POST'});
      salNewLinkItem.value=''; loadSpecItems();
    };
    const updateSpecItem = async (id) => {
      if (!salEditLinkItem.value) return;
      await api(`/api/salary/spec-items/${id}?item_name=${encodeURIComponent(salEditLinkItem.value)}&unit_price=${salEditLinkPrice.value}`, {method:'PUT'});
      salEditLinkId.value=0; salEditLinkItem.value=''; salEditLinkPrice.value=0; loadSpecItems();
    };
    const deleteSpecItem = async (id) => {
      if (!confirm('删除关联？')) return;
      await api(`/api/salary/spec-items/${id}`, {method:'DELETE'}); loadSpecItems();
    };
    const deleteSalPrice = async (id) => {
      if (!confirm('确定删除？')) return;
      await api(`/api/salary/prices/${id}`, {method:'DELETE'}); loadSalary();
    };
    const showSalDropdown = (id, list, key) => {
      const el = document.getElementById(id);
      if (!el) return;
      // Remove old
      document.querySelectorAll('.sal-dropdown').forEach(d=>d.remove());
      const filter = el.value.toLowerCase();
      const filtered = list.filter(w=>w[key].toLowerCase().includes(filter));
      if (!filtered.length) return;
      const rect = el.getBoundingClientRect();
      const div = document.createElement('div');
      div.className = 'sal-dropdown';
      div.style.cssText = `position:fixed;z-index:9999;background:#fff;border:1px solid #e2e8f0;border-radius:8px;max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.12);left:${rect.left}px;top:${rect.bottom+2}px;width:${rect.width}px;`;
      filtered.forEach(w=>{
        const item = document.createElement('div');
        item.style.cssText = 'padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9;';
        item.textContent = key==='name'?w.name+' - '+w.job_type:w.item_name+' ¥'+w.unit_price;
        item.onmousedown = e=>{e.preventDefault(); el.value=w[key]; div.remove();
          if(key==='item_name'){const p=salPrices.value.find(p=>p.item_name===w.item_name);if(p)document.getElementById('salPrice').value=p.unit_price;}};
        div.appendChild(item);
      });
      document.body.appendChild(div);
      setTimeout(()=>document.addEventListener('click',function close(e){if(!div.contains(e.target)&&e.target!==el){div.remove();document.removeEventListener('click',close);}},{once:false}),100);
    };
    const addSalRecord = async () => {
      const workerName = document.getElementById('salWorkerInput')?.value.trim();
      const wid = salWorkers.value.find(w=>w.name===workerName)?.id;
      const item = document.getElementById('salItemInput')?.value.trim();
      const qty = parseInt(document.getElementById('salQty')?.value||0);
      const price = parseFloat(document.getElementById('salPrice')?.value||0);
      const method = document.getElementById('salMethod')?.value||'微信';
      const remark = document.getElementById('salRemark')?.value||'';
      if (!wid || !item || !qty || !price) return alert('请填写完整');
      const spec = salItemSpecs.value.find(p=>p.item_name===item)?.spec_name || salFilterSpec.value || '';
      await api('/api/salary/records', {method:'POST', body:JSON.stringify({
        worker_id: wid, month: salMonth.value, spec_name: spec, item_name: item,
        quantity: qty, unit_price: price, payment_method: method, remark
      })});
      document.getElementById('salWorkerInput').value = '';
      document.getElementById('salItemInput').value = '';
      document.getElementById('salQty').value = '';
      document.getElementById('salPrice').value = '';
      document.getElementById('salRemark').value = '';
      loadSalary();
    };
    const deleteSalRecord = async (id) => {
      if (!confirm('删除？')) return;
      await api(`/api/salary/records/${id}`, {method:'DELETE'}); loadSalary();
    };
    const toggleSalPaid = async (r) => {
      await api(`/api/salary/records/${r.id}`, {method:'PUT', body:JSON.stringify({
        quantity: r.quantity, unit_price: r.unit_price,
        payment_method: r.payment_method, paid: r.paid?0:1, remark: r.remark
      })});
      loadSalary();
    };
    const exportSalary = () => window.open(`/api/salary/export?month=${salMonth.value}`, '_blank');

    const loadFinance = async () => {
      const [records, summary] = await Promise.all([
        api(`/api/finance?year=${finYear.value}&month=${finMonth.value}`),
        api(`/api/finance/summary?year=${finYear.value}&month=${finMonth.value}`)
      ]);
      finRecords.value = records; finSummary.value = summary;
    };
    const exportFinance = () => {
      window.open(`/api/finance/export?year=${finYear.value}&month=${finMonth.value}`, '_blank');
    };
    const deleteFinance = async (id) => {
      if (!confirm('确定撤销这条财务记录？')) return;
      await api(`/api/finance/${id}`, {method:'DELETE'});
      loadFinance();
    };
    const loadFinCategories = async () => {
      try { finCategories.value = await api('/api/finance/categories'); } catch(e) {}
    };
    const saveFinCat = async () => {
      if (!newFinCat.value.trim()) return;
      try {
        await api(`/api/finance/categories?name=${encodeURIComponent(newFinCat.value.trim())}`, {method:'POST'});
        newFinCat.value = ''; loadFinCategories();
      } catch(e) { alert(e.message); }
    };
    const deleteFinCat = async (id) => {
      if (!confirm('确定删除？')) return;
      try {
        await api(`/api/finance/categories/${id}`, {method:'DELETE'});
        loadFinCategories();
      } catch(e) { alert(e.message); }
    };

    const loadAnalysis = async () => {
      analysisData.value = await api(`/api/reports/sales-summary?year=${analysisYear.value}&month=${analysisMonth.value}`);
      setTimeout(() => renderCharts(), 300);
    };

    const renderCharts = () => {
      const s = analysisData.value;
      if (!s) return;

      // 销毁旧图表
      ['chartDaily','chartSalesperson','chartSpec'].forEach(id=>{
        const old = Chart.getChart(id); if (old) old.destroy();
      });

      const colors = ['#4f6ef7','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#f97316','#14b8a6','#6366f1','#84cc16','#e11d48'];

      // 1. 折线图 - 每日销售
      const dailyCtx = document.getElementById('chartDaily');
      if (dailyCtx) {
        const days = Object.keys(s.by_day);
        new Chart(dailyCtx, {
          type: 'line',
          data: {
            labels: days,
            datasets: [{
              label: '销售额', data: Object.values(s.by_day),
              borderColor: '#4f6ef7', backgroundColor: 'rgba(79,110,247,0.08)',
              fill: true, tension: 0.3, pointRadius: 3, pointHoverRadius: 6,
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { ticks: { callback: v => '¥' + (v/10000).toFixed(1) + '万' } }
            }
          }
        });
      }

      // 2. 柱状图 - 按销售人（过滤已删除的）
      const spCtx = document.getElementById('chartSalesperson');
      if (spCtx) {
        const activeNames = new Set(salespersons.value.map(s=>s.name));
        const sps = Object.entries(s.by_salesperson).filter(([n])=>activeNames.has(n));
        new Chart(spCtx, {
          type: 'bar',
          data: {
            labels: sps.map(([n])=>n),
            datasets: [{
              label: '销售额', data: sps.map(([,v])=>v),
              backgroundColor: sps.map((_,i)=>colors[i%colors.length]),
              borderRadius: 6,
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { ticks: { callback: v => '¥' + (v/10000).toFixed(1) + '万' } }
            }
          }
        });
      }

      // 3. 饼图 - 按品类
      const specCtx = document.getElementById('chartSpec');
      if (specCtx) {
        const specs = Object.entries(s.by_spec);
        new Chart(specCtx, {
          type: 'pie',
          data: {
            labels: specs.map(([n])=>n),
            datasets: [{
              data: specs.map(([,v])=>v),
              backgroundColor: specs.map((_,i)=>colors[i%colors.length]),
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { position: 'right' },
              tooltip: { callbacks: { label: ctx => ctx.label + ': ¥' + ctx.raw.toFixed(2) } }
            }
          }
        });
      }
    };

    const loadInventory = async () => {
      const d = await api('/api/inventory');
      invData.value = d.inventory; invLowStock.value = d.low_stock;
    };

    const downloadSnapshot = async () => {
      try {
        if (!token.value) { alert('请先登录'); return; }
        const headers = {'Authorization':'Bearer '+token.value};
        const res = await fetch('/api/inventory/snapshot', {headers});
        if (!res.ok) {
          const err = await res.json().catch(()=>({detail:'下载失败'}));
          alert(err.detail||'下载失败，请先登录');
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `库存快照_${today}.html`; a.click();
        URL.revokeObjectURL(url);
      } catch(e) { alert('下载失败: '+e.message); }
    };

    const saveGlobalSettings = async () => {
      const v = parseInt(globalSettings.value.low_stock_threshold);
      if (isNaN(v) || v < 0) return alert('请输入有效数字（0 或正整数）');
      await api(`/api/settings?threshold=${v}`, {method:'PUT'});
      globalSettings.value.low_stock_threshold = v;
      refreshAll();
    };

    const loadSkuThresholds = async () => {
      try { skuThresholds.value = await api('/api/skus'); } catch(e) {}
    };

    const saveSkuThreshold = async (sku) => {
      const v = parseInt(sku.threshold);
      if (isNaN(v) || v < 0) return alert('请输入有效数字');
      await api(`/api/skus/${sku.sku_id}/threshold?threshold=${v}`, {method:'PUT'});
      sku._saved = true;
      setTimeout(() => { sku._saved = false; }, 1500);
      loadInventory();
    };

    const saveSpec = async () => {
      if(!newSpec.value.trim()) return;
      await api(`/api/specs?name=${encodeURIComponent(newSpec.value.trim())}`,{method:'POST'});
      newSpec.value=''; specs.value=await api('/api/specs');
    };
    const deleteSpec = async (id) => { if(confirm('确定删除?')){try{await api(`/api/specs/${id}`,{method:'DELETE'}); specs.value=await api('/api/specs'); refreshAll();}catch(e){alert(e.message);}}};
    const editSpec = async (s) => { const n=prompt('修改:',s.name); if(n){await api(`/api/specs/${s.id}?name=${encodeURIComponent(n)}`,{method:'PUT'}); specs.value=await api('/api/specs');}};

    const saveColor = async () => {
      if(!newColor.value.trim()) return;
      await api(`/api/colors?name=${encodeURIComponent(newColor.value.trim())}&code=${newColorCode.value.trim()}`,{method:'POST'});
      newColor.value=''; newColorCode.value=''; colors.value=await api('/api/colors');
    };
    const deleteColor = async (id) => { if(confirm('确定删除?')){try{await api(`/api/colors/${id}`,{method:'DELETE'}); colors.value=await api('/api/colors'); refreshAll();}catch(e){alert(e.message);}}};
    const editColor = async (c) => { const n=prompt('修改:',c.name); if(n){await api(`/api/colors/${c.id}?name=${encodeURIComponent(n)}&code=${c.code||''}`,{method:'PUT'}); colors.value=await api('/api/colors');}};

    const saveSP = async () => {
      if(!newSP.value.trim()) return;
      await api(`/api/salespersons?name=${encodeURIComponent(newSP.value.trim())}&sp_type=${newSPType.value}`,{method:'POST'});
      newSP.value=''; salespersons.value=await api('/api/salespersons');
    };
    const deleteSP = async (id) => { if(confirm('确定删除?')){await api(`/api/salespersons/${id}`,{method:'DELETE'}); salespersons.value=await api('/api/salespersons');}};

    const importStock = async (e) => {
      const f=e.target.files[0]; if(!f) return;
      const fd=new FormData(); fd.append('file',f);
      importResult.value=await (await fetch('/api/import/stock',{method:'POST',body:fd})).json();
      if(importResult.value.ok) loadInventory();
    };

    // === Admin management ===
    const admins = ref([]);
    const newAdminUser = ref('');
    const newAdminPass = ref('');
    const showChangePwd = ref(false);
    const oldPwd = ref('');
    const newPwd = ref('');

    const loadAdmins = async () => {
      if (authUser.value?.role !== 'superadmin') return;
      try { admins.value = await api('/api/admins'); } catch(e) {}
    };

    const saveAdmin = async () => {
      if (!newAdminUser.value.trim() || !newAdminPass.value.trim()) return;
      await api('/api/admins', {method:'POST', body:JSON.stringify({username:newAdminUser.value.trim(),password:newAdminPass.value})});
      newAdminUser.value=''; newAdminPass.value=''; loadAdmins();
    };

    const resetAdminPwd = async (id, username) => {
      const pwd = prompt(`重置 ${username} 的密码：`);
      if (!pwd) return;
      await api(`/api/admins/${id}/password`, {method:'PUT', body:JSON.stringify({password:pwd})});
    };

    const deleteAdmin = async (id, username) => {
      if (!confirm(`确定删除管理员 ${username}？`)) return;
      await api(`/api/admins/${id}`, {method:'DELETE'}); loadAdmins();
    };

    const changePwd = async () => {
      if (!oldPwd.value || !newPwd.value) return;
      await api(`/api/auth/change-password?old_password=${encodeURIComponent(oldPwd.value)}&new_password=${encodeURIComponent(newPwd.value)}`, {method:'PUT'});
      showChangePwd.value=false; oldPwd.value=''; newPwd.value='';
      alert('密码修改成功');
    };

    // === Operation logs ===
    const logs = ref([]);
    const loadLogs = async () => {
      try { logs.value = await api('/api/logs?limit=200'); } catch(e) {}
    };

    const fmt = v => (v||0).toLocaleString('zh-CN',{minimumFractionDigits:2});

    const entryOutTotal = computed(() => entryRows.value.filter(r=>r.type==='出库').reduce((s,r)=>s+(r.qty||0)*(r.price||0),0));
    const entryInTotal = computed(() => entryRows.value.filter(r=>r.type==='入库').reduce((s,r)=>s+(r.qty||0),0));
    const filteredInventory = computed(() => {
      const d={};
      for(const [spec,items] of Object.entries(invData.value)){
        if(!invFilter.value||spec.includes(invFilter.value)) d[spec]=items;
      }
      return d;
    });

    return {
      // Auth
      token, authUser, loginUsername, loginPassword, loginError, loginLoading, rememberMe,
      doLogin, doLogout, showChangePwd, oldPwd, newPwd, changePwd,
      // Main
      currentTab, salSub, today, dash, dashBalance, entryDate, entryRows, submitting, msg, msgType, todayRecords,
      specs, colors, salespersons, invData, invFilter, invLowStock,
      obSP, obYear, obMonth, obData,
      inYear, inMonth, inData,
      sumYear, sumMonth, summary,
      salWorkers, salPrices, salItemSpecs, salRecords, salSummary, salMonth, salPage, salPageSize, salTotal, salFilterSpec, salFilterColor, salQuickSpec, salQuickColor, salQuickWorker, salNewWorker, salNewJobType, salNewItem, salNewPrice,
      loadSalary, saveSalWorker, deleteSalWorker, saveSalPrice, deleteSalPrice, addSalRecord, deleteSalRecord, toggleSalPaid, exportSalary, showSalDropdown,
      salSpecItems, salNewLinkSpec, salNewLinkItem, salEditLinkId, salEditLinkItem, initSpecItems, saveSpecItem, updateSpecItem, deleteSpecItem,
      finYear, finMonth, finRecords, finSummary, loadFinance, exportFinance, deleteFinance, finCategories, newFinCat, loadFinCategories, saveFinCat, deleteFinCat,
      analysisYear, analysisMonth, analysisData, loadAnalysis,
      newSpec, newColor, newColorCode, newSP, newSPType, importResult,
      quickType, quickSpec, quickSP, quickSpecs, quickColors, quickAdd,
      addEntryRow, submitEntries, loadTodayRecords, deleteTransaction, loadOutbound, exportOutbound, loadInbound, exportInbound, loadSummary, renderCharts, loadInventory, downloadSnapshot,
      saveSpec, deleteSpec, editSpec, saveColor, deleteColor, editColor,
      saveSP, deleteSP, importStock, fmt, entryOutTotal, entryInTotal, filteredInventory,
      globalSettings, saveGlobalSettings, skuThresholds, loadSkuThresholds, saveSkuThreshold,
      // Admin + Logs
      admins, newAdminUser, newAdminPass, saveAdmin, resetAdminPwd, deleteAdmin, loadAdmins,
      logs, loadLogs, showLogs,
    };
  },

  // ===== TEMPLATE using render function (no Vue template compiler needed) =====
  render() {
    // ===== LOGIN PAGE (when not authenticated) =====
    if (!this.token) {
      return h('div',{class:'login-box'},[
        h('img',{src:'/static/logo.jpg',style:{display:'block',margin:'0 auto 12px',width:'64px',height:'64px',borderRadius:'8px',objectFit:'cover'}}),
        h('h2','淼伊库服饰有限公司'),
        h('p',{class:'subtitle'},'进销存管理系统'),
        this.loginError ? h('div',{class:'error-msg'},this.loginError) : null,
        h('input',{type:'text',value:this.loginUsername,onInput:e=>this.loginUsername=e.target.value,placeholder:'用户名',onKeyup:e=>e.key==='Enter'&&this.doLogin()}),
        h('input',{type:'password',value:this.loginPassword,onInput:e=>this.loginPassword=e.target.value,placeholder:'密码',onKeyup:e=>e.key==='Enter'&&this.doLogin()}),
        h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'16px',fontSize:'13px',color:'#64748b'}},[
          h('input',{type:'checkbox',checked:this.rememberMe,onChange:e=>this.rememberMe=e.target.checked,style:{width:'auto',margin:0}}),
          h('span','记住密码'),
        ]),
        h('button',{class:'btn-primary',onClick:this.doLogin,disabled:this.loginLoading,style:{width:'100%',padding:'12px',fontSize:'16px'}},
          this.loginLoading?'登录中...':'登 录'),
      ]);
    }

    const tabs = [
      {key:'dashboard', label:'🏠 首页'},
      {key:'entry', label:'📝 每日录入'},
      {key:'inventory', label:'📦 实时库存'},
      {key:'outbound', label:'📤 出库记录'},
      {key:'inbound', label:'📥 入库记录'},
      {key:'summary', label:'📊 销售汇总'},
      {key:'analysis', label:'📈 数据分析'},
      {key:'salary', label:'💵 工资管理'},
      {key:'finance', label:'💰 财务管理'},
      {key:'thresholds', label:'⚠️ 预警阈值'},
      {key:'settings', label:'⚙️ 基础数据'},
      {key:'admin', label:'👑 管理员'},
      {key:'help', label:'📖 使用说明'},
    ];

    // --- Dashboard ---
    const renderDashboard = () => h('div',{style:{display:'flex',flexDirection:'column',gap:'20px'}},[
      // Summary stats row
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'16px'}},[
        h('div',{class:'stat-card',style:{background:'linear-gradient(135deg,#409eff,#337ecc)',cursor:'pointer'},
          onClick:()=>this.currentTab='outbound'},[
          h('div',{class:'label'},'📤 今日出库金额'),
          h('div',{class:'value'},'¥'+this.fmt(this.dash.today_out_amount)),
        ]),
        h('div',{class:'stat-card',style:{background:'linear-gradient(135deg,#67c23a,#529b2e)',cursor:'pointer'},
          onClick:()=>this.currentTab='inbound'},[
          h('div',{class:'label'},'📥 今日入库数量'),
          h('div',{class:'value'},String(this.dash.today_in_qty)+' 件'),
        ]),
        h('div',{class:'stat-card',style:{background:'linear-gradient(135deg,#e6a23c,#d4880f)',cursor:'pointer'},
          onClick:()=>this.currentTab='summary'},[
          h('div',{class:'label'},'💰 本月销售额'),
          h('div',{class:'value'},'¥'+this.fmt(this.dash.month_total)),
        ]),
        h('div',{class:'stat-card',style:{background:'linear-gradient(135deg,#f56c6c,#c0392b)',cursor:'pointer'},
          onClick:()=>this.currentTab='thresholds'},[
          h('div',{class:'label'},'🔴 低库存预警'),
          h('div',{class:'value'},String(this.dash.low_stock_count)+' SKU'),
        ]),
        h('div',{class:'stat-card',style:{background:this.dashBalance>=0?'linear-gradient(135deg,#8b5cf6,#7c3aed)':'linear-gradient(135deg,#f59e0b,#d97706)',cursor:'pointer'},
          onClick:()=>this.currentTab='finance'},[
          h('div',{class:'label'},'💰 当前余额'),
          h('div',{class:'value'},'¥'+this.dashBalance.toLocaleString()),
        ]),
      ]),

      // Quick actions + Info row
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:'16px'}},[
        // Quick actions
        h('div',{class:'card',style:{textAlign:'center'}},[
          h('div',{class:'card-title'},'⚡ 快捷操作'),
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px'}},[
            h('button',{class:'btn-primary',onClick:()=>this.currentTab='entry',style:{padding:'12px',fontSize:'13px'}},'📝 录入'),
            h('button',{class:'btn-success',onClick:()=>this.currentTab='inventory',style:{padding:'12px',fontSize:'13px'}},'📦 库存'),
            h('button',{class:'btn-warning',onClick:()=>this.currentTab='outbound',style:{padding:'12px',fontSize:'13px'}},'📤 出库'),
            h('button',{style:{padding:'12px',fontSize:'13px',background:'#8b5cf6',color:'#fff',border:'none',borderRadius:'6px',cursor:'pointer'},onClick:()=>this.currentTab='salary'},'💵 工资'),
            h('button',{style:{padding:'12px',fontSize:'13px',background:'#06b6d4',color:'#fff',border:'none',borderRadius:'6px',cursor:'pointer'},onClick:()=>this.currentTab='summary'},'📊 汇总'),
            h('button',{style:{padding:'12px',fontSize:'13px',background:'#909399',color:'#fff',border:'none',borderRadius:'6px',cursor:'pointer'},onClick:()=>this.downloadSnapshot()},'📥 快照'),
          ]),
        ]),
        // System info
        h('div',{class:'card'},[
          h('div',{class:'card-title'},'📊 系统概况'),

            h('div',{style:{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #ebeef5'}},
              [h('span','📋 规格数量'),h('b',String(this.dash.total_specs))]),
            h('div',{style:{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #ebeef5'}},
              [h('span','🎨 颜色种类'),h('b',String(this.dash.total_colors))]),
            h('div',{style:{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #ebeef5'}},

      h('div',{class:'card'},[
        h('div',{class:'card-title'},'⚠️ 全局默认预警阈值'),
        h('p',{style:{color:'#909399',fontSize:'13px',marginBottom:'16px'}},'设置全局默认低库存阈值。当 SKU 库存低于此值时，首页和库存页将显示预警。每个 SKU 可单独设置覆盖阈值。'),
        h('div',{style:{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap'}},[
          h('span',{style:{fontWeight:500}},'默认预警阈值：'),
          h('input',{type:'number',min:0,value:this.globalSettings.low_stock_threshold,
            onInput:e=>this.globalSettings.low_stock_threshold=parseInt(e.target.value)||0,
            style:{width:'100px',textAlign:'center',fontSize:'18px',fontWeight:700,padding:'8px'}}),
          h('span',{style:{color:'#909399',fontSize:'13px'}},'件'),
          h('button',{class:'btn-primary',onClick:this.saveGlobalSettings},'💾 保存设置'),
        ]),
      ]),

      // Per-SKU threshold management table
      h('div',{class:'card'},[
        h('div',{class:'card-title'},'🎯 各规格颜色阈值管理'),
        h('p',{style:{color:'#909399',fontSize:'13px',marginBottom:'16px'}},'为不同规格+颜色组合单独设置预警阈值。留空或设为 0 则使用上方的全局默认值。'),
        h('div',{style:{overflowX:'auto'}},
          h('table',{style:{minWidth:'600px'}},[
            h('thead',h('tr',[
              h('th',{style:{width:'140px'}},'规格'),
              h('th',{style:{width:'120px'}},'颜色'),
              h('th',{style:{width:'80px',textAlign:'center'}},'当前库存'),
              h('th',{style:{width:'120px',textAlign:'center'}},'预警阈值'),
              h('th',{style:{width:'100px',textAlign:'center'}},'操作'),
            ])),
            h('tbody',
              this.skuThresholds.length === 0
                ? [h('tr',{key:'empty'},h('td',{colSpan:5,style:{textAlign:'center',color:'#909399',padding:'24px'}},'暂无 SKU 数据'))]
                : this.skuThresholds.map(sku => {
                    const isLow = sku.current_stock < sku.threshold;
                    return h('tr',{key:sku.sku_id,style:{background:isLow?'#fef0f0':''}},[
                      h('td',{style:{fontWeight:500}},sku.spec_name),
                      h('td',sku.color_name),
                      h('td',{style:{textAlign:'center',color:isLow?'#f56c6c':'#303133',fontWeight:isLow?700:400}},String(sku.current_stock)),
                      h('td',{style:{textAlign:'center'}},
                        h('input',{type:'number',min:0,value:sku.threshold,
                          onInput:e=>sku.threshold=parseInt(e.target.value)||0,
                          style:{width:'80px',textAlign:'center',padding:'6px',fontSize:'14px'},
                          onKeyup:e=>{if(e.key==='Enter')this.saveSkuThreshold(sku);}
                        })
                      ),
                      h('td',{style:{textAlign:'center'}},[
                        h('button',{class:'btn-primary btn-sm',onClick:()=>this.saveSkuThreshold(sku),
                          style:{padding:'5px 10px',fontSize:'12px'}},
                          sku._saved ? '✅ 已保存' : '💾 保存'),
                      ]),
                    ]);
                  })
            )
          ])
        ),
      ]),
    ]);

    // --- Settings ---
    const renderSettings = () => h('div',{style:{display:'flex',gap:'20px',flexWrap:'wrap'}},[
      // Specs
      h('div',{class:'card',style:{flex:1,minWidth:'300px'}},[
        h('div',{style:{fontWeight:600,marginBottom:'12px'}},'📋 规格管理'),
        h('div',{style:{display:'flex',gap:'8px',marginBottom:'12px'}},[
          h('input',{value:this.newSpec,onInput:e=>this.newSpec=e.target.value,placeholder:'新规格',style:{flex:1}}),
          h('button',{class:'btn-primary btn-sm',onClick:this.saveSpec},'添加'),
        ]),
        h('table',h('tbody',this.specs.map(s=>h('tr',{key:s.id},
          h('td',[
            s.name,
            h('button',{class:'btn-sm',onClick:()=>this.editSpec(s),style:{marginLeft:'12px'}},'✏️'),
            h('button',{class:'btn-danger btn-sm',onClick:()=>this.deleteSpec(s.id),style:{marginLeft:'4px'}},'🗑')
          ])
        ))))
      ]),
      // Colors
      h('div',{class:'card',style:{flex:1,minWidth:'300px'}},[
        h('div',{style:{fontWeight:600,marginBottom:'12px'}},'🎨 颜色管理'),
        h('div',{style:{display:'flex',gap:'8px',marginBottom:'12px'}},[
          h('input',{value:this.newColor,onInput:e=>this.newColor=e.target.value,placeholder:'新颜色',style:{flex:1}}),
          h('input',{value:this.newColorCode,onInput:e=>this.newColorCode=e.target.value,placeholder:'代号',style:{width:'60px'}}),
          h('button',{class:'btn-primary btn-sm',onClick:this.saveColor},'添加'),
        ]),
        h('table',h('tbody',this.colors.map(c=>h('tr',{key:c.id},
          h('td',[
            c.name,' ',h('small',{style:{color:'#909399'}},c.code),
            h('button',{class:'btn-sm',onClick:()=>this.editColor(c),style:{marginLeft:'8px'}},'✏️'),
            h('button',{class:'btn-danger btn-sm',onClick:()=>this.deleteColor(c.id),style:{marginLeft:'4px'}},'🗑')
          ])
        ))))
      ]),
      // Salespersons
      h('div',{class:'card',style:{flex:1,minWidth:'300px'}},[
        h('div',{style:{fontWeight:600,marginBottom:'12px'}},'👥 销售人员'),
        h('div',{style:{display:'flex',gap:'8px',marginBottom:'12px'}},[
          h('input',{value:this.newSP,onInput:e=>this.newSP=e.target.value,placeholder:'新人员',style:{flex:1}}),
          h('select',{value:this.newSPType,onChange:e=>this.newSPType=e.target.value,style:{width:'80px'}},
            [h('option','员工'),h('option','渠道'),h('option','电商')]),
          h('button',{class:'btn-primary btn-sm',onClick:this.saveSP},'添加'),
        ]),
        h('table',h('tbody',this.salespersons.map(s=>h('tr',{key:s.id},
          h('td',[
            s.name,' ',h('span',{class:'tag',style:{fontSize:'11px'}},s.type),
            h('button',{class:'btn-danger btn-sm',onClick:()=>this.deleteSP(s.id),style:{marginLeft:'8px'}},'🗑')
          ])
        ))))
      ]),
      // Import
      h('div',{class:'card',style:{width:'100%',marginTop:'0'}},[
        h('div',{style:{fontWeight:600,marginBottom:'12px'}},'📥 一次性库存导入（Excel）'),
        h('p',{style:{color:'#909399',fontSize:'13px',marginBottom:'12px'}},'上传库存 Excel 文件。系统读取最后一个 Sheet 的合计行数据并覆盖当前库存。'),
        h('input',{type:'file',accept:'.xlsx',onChange:this.importStock,style:{marginBottom:'8px'}}),
        this.importResult ? h('div',{style:{color:this.importResult.ok?'#67c23a':'#f56c6c'}},
          this.importResult.ok ? `✅ 成功导入 ${this.importResult.imported_skus} 个 SKU` : '❌ 导入失败') : null
      ]),

    ]);

    // --- Admin ---
    const renderAdmin = () => h('div',{style:{display:'flex',flexDirection:'column',gap:'20px'}},[
      this.authUser?.role !== 'superadmin' ? h('div',{class:'card'},[h('p',{style:{textAlign:'center',color:'#909399',padding:'40px'}},'仅超级管理员可访问')]) : null,
      this.authUser?.role === 'superadmin' ? h('div',{class:'card'},[
        h('div',{style:{fontWeight:600,fontSize:'16px',marginBottom:'12px',display:'flex',justifyContent:'space-between'}},[
          h('span','📋 操作日志（最近 200 条）'),
          h('button',{class:'btn-primary btn-sm',onClick:this.loadLogs},'🔄 刷新'),
        ]),
        h('div',{style:{maxHeight:'400px',overflowY:'auto'}},
          h('table',[
            h('thead',h('tr',[h('th',{style:{width:'150px'}},'时间'),h('th',{style:{width:'80px'}},'操作人'),h('th',{style:{width:'80px'}},'类型'),h('th','详情')])),
            h('tbody',this.logs.map(l=>h('tr',{key:l.id},[
              h('td',{style:{fontSize:'12px',color:'#909399'}},l.created_at?.replace('T',' ').slice(0,19)),
              h('td',l.admin_name),
              h('td',h('span',{class:'tag'},l.action)),
              h('td',{style:{fontSize:'13px'}},l.detail||`${l.action} ${l.target}`),
            ])))
          ])
        )
      ]) : null,
      this.authUser?.role === 'superadmin' ? h('div',{class:'card'},[
        h('div',{style:{fontWeight:600,fontSize:'16px',marginBottom:'12px'}},'👑 管理员管理'),
        h('div',{style:{display:'flex',gap:'8px',marginBottom:'12px'}},[
          h('input',{value:this.newAdminUser,onInput:e=>this.newAdminUser=e.target.value,placeholder:'用户名',style:{flex:1}}),
          h('input',{type:'password',value:this.newAdminPass,onInput:e=>this.newAdminPass=e.target.value,placeholder:'密码',style:{flex:1}}),
          h('button',{class:'btn-primary btn-sm',onClick:this.saveAdmin},'添加管理员'),
        ]),
        h('table',h('thead',h('tr',[h('th','用户名'),h('th','角色'),h('th','最后登录'),h('th','操作')])),
          h('tbody',this.admins.map(a=>h('tr',{key:a.id},[
            h('td',a.username),
            h('td',h('span',{class:'tag',style:{background:a.role==='superadmin'?'#fdf6ec':'#f0f9eb',color:a.role==='superadmin'?'#e6a23c':'#67c23a'}},a.role)),
            h('td',{style:{fontSize:'12px',color:'#909399'}},a.last_login||'—'),
            h('td',[
              h('button',{class:'btn-sm',style:{marginRight:'8px'},onClick:()=>this.resetAdminPwd(a.id,a.username)},'🔑'),
              h('button',{class:'btn-danger btn-sm',onClick:()=>this.deleteAdmin(a.id,a.username)},'✕')
            ])
          ])))
        )
      ]) : null,
    ]);

    // ===== CHANGE PASSWORD MODAL =====
    const renderChangePwd = () => {
      if (!this.showChangePwd) return null;
      return h('div',{style:{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000},
        onClick:()=>this.showChangePwd=false
      },[
        h('div',{style:{background:'#fff',borderRadius:'12px',padding:'32px',width:'360px',textAlign:'center'},
          onClick:e=>e.stopPropagation()
        },[
          h('h3',{style:{marginBottom:'20px'}},'修改密码'),
          h('input',{type:'password',value:this.oldPwd,onInput:e=>this.oldPwd=e.target.value,placeholder:'原密码',style:{width:'100%',padding:'10px',marginBottom:'12px',boxSizing:'border-box'}}),
          h('input',{type:'password',value:this.newPwd,onInput:e=>this.newPwd=e.target.value,placeholder:'新密码',style:{width:'100%',padding:'10px',marginBottom:'20px',boxSizing:'border-box'}}),
          h('div',{style:{display:'flex',gap:'12px'}},[
            h('button',{class:'btn-primary',onClick:this.changePwd,style:{flex:1}},'确定'),
            h('button',{style:{flex:1,background:'#f5f7fa',border:'none',borderRadius:'6px',cursor:'pointer'},onClick:()=>this.showChangePwd=false},'取消'),
          ])
        ])
      ]);
    };

    // ===== MAIN RENDER =====
    return h('div',{class:'app-layout'},[
      renderChangePwd(),

      // === 左侧边栏 ===
      h('div',{class:'sidebar'},[
        h('div',{class:'sidebar-logo'},[
          h('img',{src:'/static/logo.jpg'}),
          h('div',{class:'name'},'淼伊库服饰'),
          h('div',{class:'sub'},'进销存管理系统'),
        ]),
        h('div',{class:'sidebar-nav'},
          tabs.map(tab=>h('button',{key:tab.key, class:this.currentTab===tab.key?'active':'',
            onClick:()=>{this.currentTab=tab.key;if(tab.key==='help'){window.open('/static/doc.html','_blank');this.currentTab='dashboard';return;}
if(tab.key==='outbound'){this.loadOutbound();}if(tab.key==='inbound'){this.loadInbound();}
if(tab.key==='admin'){this.loadAdmins();this.loadLogs();}if(tab.key==='salary'){this.loadSalary();}if(tab.key==='finance'){this.loadFinance();this.loadFinCategories();}if(tab.key==='summary'){this.loadSummary();}if(tab.key==='analysis'){this.loadAnalysis();}}
          },tab.label))
        ),
        h('div',{class:'sidebar-footer'},[
          h('button',{class:'btn-sm',style:{background:'#f5f7fa'},onClick:()=>this.showChangePwd=true},'🔑'),
          h('button',{class:'btn-danger btn-sm',onClick:this.doLogout},'退出'),
        ]),
      ]),

      // === 主内容区 ===
      h('div',{class:'main-content'},[
        this.currentTab === 'dashboard' ? renderDashboard() :
        this.currentTab === 'entry' ? renderEntry() :
        this.currentTab === 'inventory' ? renderInventory() :
        this.currentTab === 'outbound' ? renderOutbound() :
        this.currentTab === 'inbound' ? renderInbound() :
        this.currentTab === 'salary' ? renderSalary() :
        this.currentTab === 'finance' ? renderFinance() :
        this.currentTab === 'summary' ? renderSummary() :
        this.currentTab === 'analysis' ? renderAnalysis() :
        this.currentTab === 'thresholds' ? renderThresholds() :
        this.currentTab === 'settings' ? renderSettings() :
        this.currentTab === 'admin' ? renderAdmin() : null
      ])
    ]);
  }
}).mount('#app');
</script>
</body>
</html>
